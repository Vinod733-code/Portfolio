# Modern DevOps Portfolio Layout (Different Design)

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinod Dampuru | DevOps Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1e293b, #0f172a);
      padding: 40px;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .left h4 {
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .left h1 {
      font-size: 60px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .left h1 span {
      color: #38bdf8;
    }

    .left p {
      color: #cbd5e1;
      margin-bottom: 25px;
      font-size: 17px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 500;
      transition: 0.3s ease;
    }

    .primary {
      background: #38bdf8;
      color: #0f172a;
    }

    .primary:hover {
      background: #0ea5e9;
      transform: translateY(-3px);
    }

    .secondary {
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    .secondary:hover {
      background: #38bdf8;
      color: #0f172a;
      transform: translateY(-3px);
    }

    .right {
      display: flex;
      justify-content: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .profile h2 {
      margin-bottom: 8px;
    }

    .profile p {
      color: #94a3b8;
    }

    .info {
      display: grid;
      gap: 15px;
    }

    .info-box {
      background: rgba(255,255,255,0.04);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
